openapi: 3.1.0
info:
  title: Ryes generar remitos API
  description: >
    Contrato del backend para la plataforma "Ryes generar remitos" (laboratorio dental).
    Herramienta interna, sin autenticación. Los endpoints son por entidad
    (/patients, /orders, /reports, ...); el contexto de sucursal se pasa en el header
    obligatorio `X-Ryes-Id`. Las órdenes y remitos reciben IDs en los requests y
    devuelven objetos embebidos en los responses. Montos en pesos (ARS) sin decimales.
    Fechas de negocio en formato YYYY-MM-DD; createdAt/updatedAt con hora ISO-8601.
  version: 1.2.0
servers:
  - url: /api/v1
tags:
  - name: Ryes
    description: Sucursales (solo lectura)
  - name: Patients
    description: Pacientes
  - name: Dentists
    description: Odontólogos
  - name: Services
    description: Servicios
  - name: Orders
    description: Órdenes de trabajo
  - name: Reports
    description: Remitos

paths:
  /ryes:
    get:
      tags: [Ryes]
      summary: Lista de sucursales
      operationId: listRyes
      responses:
        "200":
          description: Lista de Ryes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ryes"

  /patients:
    parameters:
      - $ref: "#/components/parameters/RyesId"
    get:
      tags: [Patients]
      summary: Lista pacientes de la sucursal
      operationId: listPatients
      parameters:
        - name: search
          in: query
          required: false
          description: Filtra por nombre completo o DNI (búsqueda parcial)
          schema:
            type: string
      responses:
        "200":
          description: Lista de pacientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patient"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Patients]
      summary: Crear paciente
      operationId: createPatient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInput"
      responses:
        "201":
          description: Paciente creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /patients/lookup:
    parameters:
      - $ref: "#/components/parameters/RyesId"
    get:
      tags: [Patients]
      summary: Buscar paciente por DNI exacto (autofill del formulario de órdenes)
      operationId: lookupPatientByDni
      parameters:
        - name: dni
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Paciente encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /patients/{id}:
    parameters:
      - $ref: "#/components/parameters/RyesId"
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Patients]
      summary: Detalle de paciente
      operationId: getPatient
      responses:
        "200":
          description: Paciente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Patients]
      summary: Actualizar paciente
      operationId: updatePatient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInput"
      responses:
        "200":
          description: Paciente actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Patients]
      summary: Eliminar paciente
      operationId: deletePatient
      responses:
        "204":
          description: Eliminado
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /dentists:
    parameters:
      - $ref: "#/components/parameters/RyesId"
    get:
      tags: [Dentists]
      summary: Lista odontólogos de la sucursal
      operationId: listDentists
      parameters:
        - name: search
          in: query
          required: false
          description: Filtra por nombre o apellido (búsqueda parcial)
          schema:
            type: string
      responses:
        "200":
          description: Lista de odontólogos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dentist"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Dentists]
      summary: Crear odontólogo
      operationId: createDentist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DentistInput"
      responses:
        "201":
          description: Odontólogo creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dentist"
        "400":
          $ref: "#/components/responses/BadRequest"

  /dentists/{id}:
    parameters:
      - $ref: "#/components/parameters/RyesId"
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Dentists]
      summary: Detalle de odontólogo
      operationId: getDentist
      responses:
        "200":
          description: Odontólogo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dentist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Dentists]
      summary: Actualizar odontólogo
      operationId: updateDentist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DentistInput"
      responses:
        "200":
          description: Odontólogo actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dentist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Dentists]
      summary: Eliminar odontólogo
      operationId: deleteDentist
      responses:
        "204":
          description: Eliminado
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /services:
    parameters:
      - $ref: "#/components/parameters/RyesId"
    get:
      tags: [Services]
      summary: Lista servicios de la sucursal
      operationId: listServices
      responses:
        "200":
          description: Lista de servicios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Services]
      summary: Crear servicio
      operationId: createService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Servicio creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/BadRequest"

  /services/{id}:
    parameters:
      - $ref: "#/components/parameters/RyesId"
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Services]
      summary: Detalle de servicio
      operationId: getService
      responses:
        "200":
          description: Servicio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Services]
      summary: Actualizar servicio
      operationId: updateService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "200":
          description: Servicio actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Services]
      summary: Eliminar servicio
      operationId: deleteService
      responses:
        "204":
          description: Eliminado
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /orders:
    parameters:
      - $ref: "#/components/parameters/RyesId"
    get:
      tags: [Orders]
      summary: Lista órdenes de la sucursal
      operationId: listOrders
      parameters:
        - name: status
          in: query
          required: false
          description: Filtra por estado
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: search
          in: query
          required: false
          description: Filtra por nombre de paciente
          schema:
            type: string
      responses:
        "200":
          description: Lista de órdenes (con paciente, odontólogo y servicios embebidos)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Orders]
      summary: Crear orden
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Orden creada (estado pending)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /orders/{id}:
    parameters:
      - $ref: "#/components/parameters/RyesId"
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Orders]
      summary: Detalle de orden
      operationId: getOrder
      responses:
        "200":
          description: Orden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Orders]
      summary: Actualizar orden
      operationId: updateOrder
      description: >
        Solo válido para órdenes pending o completed. Una orden submitted
        no se puede editar (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "200":
          description: Orden actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Orders]
      summary: Eliminar orden
      operationId: deleteOrder
      responses:
        "204":
          description: Eliminada
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /orders/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/RyesId"
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Orders]
      summary: Marcar orden como completada
      operationId: completeOrder
      description: Transición pending → completed. Otro estado devuelve 422.
      responses:
        "200":
          description: Orden completada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /reports:
    parameters:
      - $ref: "#/components/parameters/RyesId"
    get:
      tags: [Reports]
      summary: Lista remitos de la sucursal
      operationId: listReports
      responses:
        "200":
          description: Lista de remitos (con órdenes embebidas)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobReport"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Reports]
      summary: Generar remito
      operationId: generateReport
      description: >
        Atómico. Valida que todas las órdenes existan y estén completadas, calcula el
        total con los precios vigentes, persiste el remito con el snapshot de cada
        orden y marca las órdenes como submitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
      responses:
        "201":
          description: Remito generado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /reports/{id}:
    parameters:
      - $ref: "#/components/parameters/RyesId"
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Reports]
      summary: Detalle de remito
      operationId: getReport
      responses:
        "200":
          description: Remito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Reports]
      summary: Eliminar remito
      operationId: deleteReport
      responses:
        "204":
          description: Eliminado
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    RyesId:
      name: X-Ryes-Id
      in: header
      required: true
      description: ID de la sucursal. Header obligatorio con el contexto de todos los recursos.
      schema:
        $ref: "#/components/schemas/Uuid"
    Id:
      name: id
      in: path
      required: true
      description: ID del recurso
      schema:
        $ref: "#/components/schemas/Uuid"

  schemas:
    Uuid:
      type: string
      format: uuid

    Date:
      type: string
      format: date

    DateTime:
      type: string
      format: date-time

    Ryes:
      type: object
      required: [id, location]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        location:
          type: string
          example: Talar

    Patient:
      type: object
      required: [id, ryesId, fullname, dni, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        ryesId:
          $ref: "#/components/schemas/Uuid"
        fullname:
          type: string
          example: María González
        dni:
          type: integer
          minimum: 1
          example: 35123456
        createdAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"

    PatientInput:
      type: object
      required: [fullname, dni]
      properties:
        fullname:
          type: string
          minLength: 1
          example: María González
        dni:
          type: integer
          minimum: 1
          example: 35123456

    Dentist:
      type: object
      required: [id, ryesId, name, lastname, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        ryesId:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          example: Roberto
        lastname:
          type: string
          example: Sánchez
        createdAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"

    DentistInput:
      type: object
      required: [name, lastname]
      properties:
        name:
          type: string
          minLength: 1
          example: Roberto
        lastname:
          type: string
          minLength: 1
          example: Sánchez

    Service:
      type: object
      required: [id, ryesId, name, price, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        ryesId:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          example: Corona de porcelana
        price:
          type: integer
          minimum: 0
          description: Monto en pesos (ARS) sin decimales
          example: 25000
        createdAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"

    ServiceInput:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          minLength: 1
          example: Corona de porcelana
        price:
          type: integer
          minimum: 0
          example: 25000

    OrderStatus:
      type: string
      enum: [pending, completed, submitted]
      description: >
        pending → completed (POST /orders/{id}/complete); completed → submitted
        (implícito al generar un remito).

    CreateOrderRequest:
      type: object
      required: [patientId, dentistId, serviceIds, dispatchDate, dueDate]
      properties:
        patientId:
          $ref: "#/components/schemas/Uuid"
        dentistId:
          $ref: "#/components/schemas/Uuid"
        serviceIds:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Uuid"
        dispatchDate:
          $ref: "#/components/schemas/Date"
        dueDate:
          $ref: "#/components/schemas/Date"
          description: Debe ser >= dispatchDate
        lab:
          type: string
          example: Lab Central

    Order:
      type: object
      required:
        [id, ryesId, patient, dentist, services, dispatchDate, dueDate, lab, status, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        ryesId:
          $ref: "#/components/schemas/Uuid"
        patient:
          $ref: "#/components/schemas/Patient"
        dentist:
          $ref: "#/components/schemas/Dentist"
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        dispatchDate:
          $ref: "#/components/schemas/Date"
        dueDate:
          $ref: "#/components/schemas/Date"
        lab:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        createdAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"

    CreateReportRequest:
      type: object
      required: [orderIds, deliveryDate]
      properties:
        orderIds:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Uuid"
        deliveryDate:
          $ref: "#/components/schemas/Date"

    JobReport:
      type: object
      required: [id, ryesId, deliveryDate, totalPrice, orders, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        ryesId:
          $ref: "#/components/schemas/Uuid"
        deliveryDate:
          $ref: "#/components/schemas/Date"
        totalPrice:
          type: integer
          minimum: 0
          description: Suma de los precios vigentes de los servicios de las órdenes incluidas (ARS)
          example: 105000
        orders:
          type: array
          description: Snapshot de cada orden al momento de generar el remito
          items:
            $ref: "#/components/schemas/Order"
        createdAt:
          $ref: "#/components/schemas/DateTime"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: ORDER_NOT_COMPLETED
            message:
              type: string
              example: Solo las órdenes completadas pueden incluirse en un remito
            details:
              type: object
              description: Información adicional opcional (por ejemplo, el orderId que falló)

  responses:
    BadRequest:
      description: Validación de campos (incluye header X-Ryes-Id ausente o inválido)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflicto (DNI duplicado, entidad referenciada, edición de orden submitted)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: Regla de negocio violada
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
